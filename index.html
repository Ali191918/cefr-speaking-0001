async function loadAll(){

    sb.from("results").select("*").order("created_at",{ascending:false}).limit(300),
    sb.from("ranked_results").select("user_id,nickname,score,created_at").order("created_at",{ascending:false}).limit(5000)]);
  mine=a.data||[];board=b.data||[];err=(a.error||b.error)?(a.error||b.error).message:"";

function agg(rows,min){
  const m={};rows.forEach(r=>{(m[r.user_id]=m[r.user_id]||{id:r.user_id,nick:r.nickname,s:[]}).s.push(r)});
  return Object.values(m).map(u=>{u.s.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
    const l=u.s.slice(0,5);u.n=u.s.length;u.total=u.s.reduce((x,r)=>x+r.score,0);u.avg=l.reduce((x,r)=>x+r.score,0)/l.length;u.q=u.n>=min;return u})
    .sort((x,y)=>y.q-x.q||y.avg-x.avg||y.total-x.total);
}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function streak(){const ds=new Set(mine.map(r=>dkey(new Date(r.created_at))));let d=new Date();if(!ds.has(dkey(d)))d=new Date(+d-DAY);let n=0;while(ds.has(dkey(d))){n++;d=new Date(+d-DAY)}return n}
function progress(){
  const f={};mine.forEach(r=>{if(r.mock_no){const t=Date.parse(r.created_at);if(!f[r.mock_no]||t<f[r.mock_no])f[r.mock_no]=t}});
  const mx=Math.max(0,...Object.keys(f).map(Number));
  if(!mx)return {un:1,openAt:0};
  const openAt=f[mx]+WAIT_MS;
  return {un:Math.min(25,Date.now()>=openAt?mx+1:mx),openAt};
}

function nav(){return `<nav><button data-t="home" class="${tab==="home"?"on":""}">🏠 Asosiy</button><button data-t="board" class="${tab==="board"?"on":""}">🏆 Reyting</button></nav>`}
function bindNav(){app.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
async function home(){screen="home";tab="home";app.innerHTML=shell(`<div class="card mu">Yuklanmoqda…</div>`);await loadAll();render()}
function render(){
  if(screen!=="home")return;
  app.innerHTML=shell(tab==="home"?renderHome():renderBoard())+nav();bindNav();
  if(tab==="home")bindHome();else bindBoard();
}
function renderHome(){
  const all=agg(board,3),wk=agg(board.filter(r=>new Date(r.created_at)>=weekStart()),1);
  const rank=all.findIndex(u=>u.id===uid)+1,me=all.find(u=>u.id===uid);

  const {un,openAt}=progress(),doneSet=new Set(mine.filter(r=>r.ranked).map(r=>r.mock_no));
  const nx=Array.from({length:un},(_,i)=>i+1).find(n=>!doneSet.has(n));

    :`<p>✅ Ochilgan mock’larning hammasi topshirildi.</p><p class="mu">${wait}</p>`;
  const prac=Array.from({length:un},(_,i)=>`<button class="sec" data-go="${i}" data-r="${doneSet.has(i+1)?0:1}">#${i+1}${doneSet.has(i+1)?" ✓":""}</button>`).join("");
  return `<div class="card hero"><div class="top"><div class="av">${esc(nick[0].toUpperCase())}</div><div style="flex:1;min-width:0"><b style="font-size:20px">${esc(nick)}</b> <button class="sec sm" id="ed" style="padding:2px 8px">✎</button><div class="bd">${bd.map(b=>`<span>${b}</span>`).join("")||'<span class="mu">Nishonlar mock topshirgach chiqadi</span>'}</div></div></div>
  <div class="stats"><div><b>${me?me.total:0}</b><small>Jami ball</small></div><div><b>${me?me.avg.toFixed(1):"—"}</b><small>O‘rtacha</small></div><div><b>${me&&me.q?"#"+rank:"—"}</b><small>Reyting</small></div><div><b>${me?me.n:0}</b><small>Mock</small></div></div>
  ${me&&!me.q?`<p class="mu">Reytingga kirish uchun yana ${3-me.n} ta reytingli mock topshiring.</p>`:""}</div>
  <div class="card"><h2>Navbatdagi mock</h2>${tc}</div>
  <div class="card"><h2>Barcha mock’lar</h2><p class="mu">Mock’ni topshirgach, 1 soatdan keyin keyingisi ochiladi. ✓ belgilini qayta ishlasangiz, u mashq bo‘ladi va ball bermaydi.</p><div class="pl">${prac}</div></div>
  <div class="card"><h2>So‘nggi natijalar</h2>${err?`<p class="mu">Xato: ${esc(err)}</p>`:mine.length?mine.slice(0,6).map(r=>`<div class="row2"><span class="n">${esc(r.part)} · ${new Date(r.created_at).toLocaleDateString()}${r.ranked?" 🏅":""}</span><b>${esc(r.level)} · ${r.score}/75</b></div>`).join(""):'<p class="mu">Hozircha natija yo‘q.</p>'}</div>
  <button class="sec" id="out">Chiqish</button>
  <div class="by2">Yaratuvchi: <a href="https://t.me/${TG_USER}" target="_blank" rel="noopener">Telegram @${TG_USER}</a></div>`;
}
function bindHome(){
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>begin(+b.dataset.go,b.dataset.r==="1"));
  $("#out").onclick=()=>sb.auth.signOut();
  $("#ed").onclick=async()=>{const v=(prompt("Yangi taxallus (3–16 belgi, lotin harflari/raqam):",nick)||"").trim();
    if(!v||v===nick)return;if(!/^[A-Za-z0-9_.]{3,16}$/.test(v))return alert("Taxallus noto‘g‘ri.");

    if(error)return alert(error.code==="23505"?"Bu taxallus band.":error.message);nick=v;await loadAll();render()};
}
function renderBoard(){
  const rows=lbMode==="week"?agg(board.filter(r=>new Date(r.created_at)>=weekStart()),1):agg(board,3);
  return `<h1>🏆 Reyting</h1><div class="tabs"><button class="${lbMode==="week"?"":"sec"}" data-m="week">Haftalik</button><button class="${lbMode==="all"?"":"sec"}" data-m="all">Umumiy</button></div>
  <p class="mu">Ball: oxirgi 5 ta reytingli mock o‘rtachasi (75 dan). Umumiy jadvalga kirish uchun kamida 3 ta mock kerak.</p>
  <div class="card">${err?`<p class="mu">Xato: ${esc(err)}</p>`:rows.length?rows.map((u,i)=>`<div class="row2 ${u.id===uid?"me":""} ${u.q?"":"dim"}"><span class="rk">${u.q&&i<3?MED[i]:i+1}</span><span class="n">${esc(u.nick)}</span><span class="mu">${u.n} mock</span><b>${u.avg.toFixed(1)}</b></div>`).join(""):'<p class="mu">Hali hech kim yo‘q. Birinchi bo‘ling!</p>'}</div>`;
}
function bindBoard(){app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{lbMode=b.dataset.m;render()})}

// ===== TEST =====
const imgCache={};let imgNote="",wmOk=0,wmErr="";
async function wm(k,n){
  const key=k+"|"+n;if(key in imgCache)return imgCache[key];
  try{
    const q=encodeURIComponent(k.replace(/,/g," ")+" filetype:bitmap -logo -map -diagram -flag -icon");
    const r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=15&prop=imageinfo&iiprop=url|mime|size&iiurlwidth=800&gsrsearch="+q);
    const j=await r.json();
    const pg=Object.values((j.query||{}).pages||{}).filter(x=>x.imageinfo&&/jpeg/.test(x.imageinfo[0].mime)&&x.imageinfo[0].width>=700&&x.imageinfo[0].width>=x.imageinfo[0].height).sort((a,b)=>a.index-b.index);
    imgCache[key]=pg.length?pg[0].imageinfo[0].thumburl:"";
    if(imgCache[key])wmOk++;else wmErr="qidiruv natija bermadi ("+k+")";
  }catch(e){imgCache[key]="";wmErr=String(e).slice(0,70)}
  return imgCache[key];
}
async function resolveImgs(st){
  const jobs=[];
  st.forEach(x=>{
    (x.pics||[]).forEach(p=>{if(p.k&&!p.done){p.done=1;jobs.push(wm(p.k,p.n).then(u=>{if(u)p.img=u}))}});
    if(x.imgk&&!x.done){x.done=1;jobs.push(wm(x.imgk,x.imgn).then(u=>{if(u)x.img=u}))}
  });
  await Promise.race([Promise.all(jobs),new Promise(r=>setTimeout(r,5000))]);
  imgNote=wmOk?"":"Rasm manbasiga ulanib bo‘lmadi: "+(wmErr||"kutish vaqti tugadi");
}
async function begin(idx,ranked){
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch{return alert("Mikrofonga ruxsat bering.")}
  ctx=new (window.AudioContext||window.webkitAudioContext)();inRate=ctx.sampleRate;
  src=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(4096,1,1);
  proc.onaudioprocess=e=>{if(capturing)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
  src.connect(proc);proc.connect(ctx.destination);
  steps=buildMock(idx);curIdx=idx;curRanked=ranked;await resolveImgs(steps);
  screen="test";aborted=false;unit=null;pending=[];
  if(window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  run();
}
function setStatus(k){const e=$("#stt");if(!e)return;
  const m={speak:"🔊 Savol o‘qilmoqda",prep:"⏱ Tayyorlaning",rec:"Eshitilmoqda"};
  e.className=k==="rec"?"rec":"";e.style.display=m[k]?"block":"none";e.textContent=m[k]||""}
function speak(t){return new Promise(res=>{
  if(!window.speechSynthesis||aborted)return res();
  const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.95;let d=false;const f=()=>{if(!d){d=true;res()}};
  u.onend=f;u.onerror=f;setTimeout(f,25000);speechSynthesis.speak(u)})}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},200)}catch{}}
function stepper(p){return `<div class="st">`+[1,2,3].map(i=>`${i>1?`<div class="bar ${p>=i?"done":""}"></div>`:""}<div class="c ${p>i?"done":p===i?"on":""}">${p>i?"✓":i}</div>`).join("")+`</div>`}
function view(s){
  let h=`<div class="q">`;
  h+=s.n?`<b>Question ${s.n}.</b> ${esc(s.text)}`:`<b>${esc(s.text)}</b>`;
  if(s.pics)h+=`<div class="pics">${s.pics.map(p=>p.img?`<img class="photo" src="${p.img}" alt="" onerror="this.outerHTML='<div class=pic>${p.e}<small>rasm yuklanmadi</small></div>'">`:`<div class="pic">${p.e}<small>${esc(p.c)}</small></div>`).join("")}</div>`;
  if(s.img)h+=`<img class="photo" src="${s.img}" alt="" onerror="this.outerHTML='<div class=mu>rasm yuklanmadi</div>'">`;
  if(imgNote&&(s.pics||s.img))h+=`<div class="mu" style="font-size:12px">${esc(imgNote)}</div>`;
  if(s.bullets)h+=`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`;
  if(s.table)h+=`<table><tr><th colspan="2" style="text-align:center">${esc(s.table.title)}</th></tr><tr><th>Pros</th><th>Cons</th></tr><tr><td><ul>${s.table.pros.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></td><td><ul>${s.table.cons.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></td></tr></table>`;
  h+=`</div>`;
  app.innerHTML=shell(`<div class="card exam">${stepper(s.part)}<div class="row">${h}<div class="tm" id="tm"></div></div>
  <div style="display:flex;gap:8px;margin-top:20px"><button class="sec sm" id="skip">Keyingisi ›</button><button class="sec sm" id="stop">✕ To‘xtatish</button></div></div>`);
  $("#skip").onclick=()=>skipFn&&skipFn();
  $("#stop").onclick=()=>{aborted=true;speechSynthesis&&speechSynthesis.cancel();skipFn&&skipFn();cleanup();home()};
}
function draw(left,total,rect,txt){
  const el=$("#tm");if(!el)return;
  if(rect){el.innerHTML=`<div class="rect">${txt||mmss(Math.max(left,0))}</div>`;return}
  const C=2*Math.PI*62;
  el.innerHTML=`<div class="ring"><svg width="140" height="140"><circle cx="70" cy="70" r="62" fill="none" stroke="#e3e6e8" stroke-width="12"/><circle cx="70" cy="70" r="62" fill="none" stroke="#111" stroke-width="12" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.max(left,0)/total)}"/></svg><b>${Math.max(left,0)}</b></div>`;
}
function count(total,rect){return new Promise(res=>{
  const end=Date.now()+total*1000;let left=total;draw(left,total,rect);
  const t=setInterval(()=>{
    const l=Math.max(0,Math.ceil((end-Date.now())/1000));
    if(l!==left){left=l;draw(left,total,rect)}
    if(left<=0){clearInterval(t);skipFn=null;res(total)}
  },200);
  skipFn=()=>{clearInterval(t);skipFn=null;res(total-left)};
})}
async function run(){
  for(const s of steps){
    if(aborted)return;
    if(unit!==s.pn){if(unit)finishUnit();unit=s.pn;chunks=[];secs=0;qs=[]}
    qs.push((s.n?"Q"+s.n+": ":"")+s.text+(s.bullets?" "+s.bullets.join(" "):"")+(s.desc?" ["+s.desc+"]":"")+(s.table?" [Table pros: "+s.table.pros.join("; ")+". Cons: "+s.table.cons.join("; ")+"]":""));
    view(s);draw(s.prep,s.prep,false);
    setStatus("speak");await speak(s.text+(s.bullets?" "+s.bullets.join(" "):""));setStatus("prep");
    if(aborted)return;
    await count(s.prep,false);
    if(aborted)return;
    beep();capturing=true;setStatus("rec");
    const used=await count(s.ans,!!s.long);
    capturing=false;setStatus("");secs+=used;
    if(s.long&&!aborted){draw(0,1,true,"Time up!");await new Promise(r=>setTimeout(r,900))}
  }
  if(aborted)return;
  finishUnit();cleanup();
  app.innerHTML=shell(`<div class="card"><h2>Baholanmoqda…</h2></div>`);
  result(await Promise.all(pending));
}
function cleanup(){capturing=false;setStatus("");try{proc.disconnect();src.disconnect();stream.getTracks().forEach(t=>t.stop());ctx.close()}catch{}}
function finishUnit(){
  const pn=unit,question=qs.join(" | "),seconds=secs,ch=chunks;
  pending.push((async()=>{
    if(seconds<3)return {pn,skipped:true};
    try{
      const b64=await toWavB64(ch);
      const {data}=await sb.auth.getSession();
      const r=await fetch("/api/grade",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+data.session.access_token},body:JSON.stringify({audio:b64,part:pn,question,seconds})});
      const j=await r.json();if(!r.ok)throw new Error(j.error||"Xato");
      return {pn,...j};
    }catch(e){return {pn,error:e.message}}
  })());
}
function toWavB64(ch){
  const R=11025,n=ch.reduce((a,c)=>a+c.length,0),all=new Float32Array(n);let o=0;
  ch.forEach(c=>{all.set(c,o);o+=c.length});
  const ratio=inRate/R,len=Math.floor(n/ratio),pcm=new Int16Array(len);
  for(let i=0;i<len;i++){const s=Math.floor(i*ratio),e=Math.min(Math.floor((i+1)*ratio),n);let sum=0;
    for(let j=s;j<e;j++)sum+=all[j];pcm[i]=Math.max(-1,Math.min(1,sum/Math.max(e-s,1)))*32767}
  const h=new DataView(new ArrayBuffer(44)),w=(p,s)=>[...s].forEach((c,i)=>h.setUint8(p+i,c.charCodeAt(0)));
  w(0,"RIFF");h.setUint32(4,36+len*2,true);w(8,"WAVEfmt ");h.setUint32(16,16,true);h.setUint16(20,1,true);h.setUint16(22,1,true);
  h.setUint32(24,R,true);h.setUint32(28,R*2,true);h.setUint16(32,2,true);h.setUint16(34,16,true);w(36,"data");h.setUint32(40,len*2,true);
  return new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result.split(",")[1]);f.readAsDataURL(new Blob([h,pcm],{type:"audio/wav"}))});
}
const lvl=s=>s>=65?"C1":s>=51?"B2":s>=38?"B1":"Below B1";
async function result(rs){
  screen="result";
  const done=rs.filter(r=>!r.error&&!r.skipped),skipped=rs.filter(r=>r.skipped),failed=rs.filter(r=>r.error);
  const avg=k=>done.length?(done.reduce((a,r)=>a+(+r[k]||0),0)/done.length).toFixed(1):"—";
  const score=done.length?Math.round(done.reduce((a,r)=>a+(+r.score||0),0)/done.length):0,level=done.length?lvl(score):"—";
  let note="";
  if(!done.length)note="Hech bir qism ishlanmagani uchun natija saqlanmadi.";
  else{
    const {error}=await sb.from("results").insert({part:"Mock #"+(curIdx+1)+(done.length<4?" ("+done.length+"/4 qism)":""),level,score,mock_no:curIdx+1,ranked:curRanked&&done.length===4});
    if(error)note="Natija saqlanmadi: "+error.message;
    else if(done.length<4)note="Natija tarixga saqlandi. Reytingga faqat 4 ta qism to‘liq ishlangan mock hisoblanadi.";
    else note=curRanked?"✅ Natija reytingga hisoblandi.":"Mashq natijasi saqlandi (reytingga hisoblanmaydi).";
  }
  const cards=rs.map(r=>`<div class="card">${r.skipped?`<b>${esc(r.pn)}:</b> <span class="mu">o‘tkazib yuborildi</span>`:r.error?`<b>${esc(r.pn)}:</b> baholanmadi (${esc(r.error)})`:`<b>${esc(r.pn)} · ${esc(r.level)} · ${esc(r.score)}/75</b><br>${esc(r.summary)}${(r.tips||[]).map(t=>`<br>• ${esc(t)}`).join("")}`}</div>`).join("");
  app.innerHTML=shell(`<div class="card exam">${stepper(4)}<div class="mu" style="text-align:center">Umumiy daraja${done.length&&done.length<4?` (${done.length}/4 qism)`:""}</div><div class="big">${level}</div><div class="mu" style="text-align:center">${done.length?score+" / 75":""}</div>
  <div class="g"><div>Ravonlik<br><b>${avg("fluency")}</b></div><div>Lug‘at<br><b>${avg("vocabulary")}</b></div><div>Grammatika<br><b>${avg("grammar")}</b></div><div>Talaffuz<br><b>${avg("pronunciation")}</b></div></div>
  <p class="mu">${esc(note)}</p></div>${cards}<button id="back">Bosh sahifa</button>`);
  $("#back").onclick=home;
}
</script></body></html>
