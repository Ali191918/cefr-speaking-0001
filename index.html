<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEFR Speaking · Full Mock</title>
<style>
:root{--bg:#6b6e73;--g:#4f9238;--b:#41adc9;--tx:#111}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
.page{max-width:760px;margin:0 auto;background:#fff;min-height:100vh;padding:20px 18px;box-sizing:border-box}
h1{font-size:24px;margin:6px 0}.mu{color:#666;font-size:14px}
input{font:inherit;width:100%;box-sizing:border-box;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #ccc}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--b);color:#fff;width:100%;margin-top:10px}
button.sec{background:#e9eef2;color:#26566a}button.sm{width:auto;padding:8px 14px;font-size:15px}
.st{display:flex;align-items:center;margin:4px 0 18px}
.c{width:54px;height:54px;border-radius:50%;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;box-shadow:0 2px 5px #0003}
.c.on,.c.done{background:var(--g)}.bar{height:20px;flex:1;background:var(--b);max-width:150px}.bar.done{background:var(--g)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.q{flex:1;min-width:240px}
.tm{width:150px;text-align:center;flex:none;margin:0 auto}
.ring{position:relative;width:140px;height:140px}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:400}
.rect{background:var(--g);color:#fff;font-size:40px;padding:10px 14px;font-variant-numeric:tabular-nums}
.pics{display:flex;gap:10px;margin:12px 0}.pic{flex:1;background:#eef2f5;border-radius:6px;padding:18px 6px;text-align:center;font-size:54px;box-shadow:0 1px 4px #0003}
.pic small{display:block;font-size:14px;color:#555}.pic img{width:100%;border-radius:4px}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:16px}td,th{border:1px solid #111;padding:8px;vertical-align:top;text-align:left}
ul{margin:8px 0;padding-left:22px}
.big{font-size:56px;font-weight:700;color:var(--g);text-align:center}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.g div{background:#eef2f5;border-radius:8px;padding:8px;text-align:center}
.hi{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd;font-size:15px}
</style></head>
<body><div class="page" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Supabase sozlamalari
const SUPABASE_URL="https://rwtfjrtozmbjmhiroonr.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_9cmiBxHtYK0tYDXbYjA9Jg_oAfa2O7j";

// 2) VAQTLAR (soniya). Videoga qarab shu yerda o‘zgartiring.
const T={q:{prep:5,ans:30},pic:{prep:10,ans:45},p2:{prep:60,ans:120},p3:{prep:60,ans:120}};

// 3) SAVOLLAR. Haqiqiy rasm uchun img:"rasm.jpg" qo‘shing (rasmni GitHub’ga yuklang).
const STEPS=[
{part:1,pn:"Part 1.1",n:1,text:"What do you usually do on weekends?",...T.q},
{part:1,pn:"Part 1.1",n:2,text:"Tell me about your best friend.",...T.q},
{part:1,pn:"Part 1.1",n:3,text:"What kind of music do you like listening to?",...T.q},
{part:1,pn:"Part 1.2",n:4,text:"What do you see in these pictures?",pics:[{e:"🏠💻",c:"Picture 1"},{e:"📚👥",c:"Picture 2"}],desc:"Picture 1: a student studying with a laptop at home. Picture 2: students studying together in a library.",...T.pic},
{part:1,pn:"Part 1.2",n:5,text:"Which way of studying do you prefer, and why?",pics:[{e:"🏠💻",c:"Picture 1"},{e:"📚👥",c:"Picture 2"}],...T.q},
{part:1,pn:"Part 1.2",n:6,text:"Do you think students will study more online in the future? Why?",pics:[{e:"🏠💻",c:"Picture 1"},{e:"📚👥",c:"Picture 2"}],...T.q},
{part:2,pn:"Part 2",text:"Look at the photograph.",pics:[{e:"🏞️",c:""}],desc:"Photograph: a quiet park with a lake.",bullets:["Describe a place where you like to relax.","Tell about what you usually do there.","Why is it important for people to have places to relax?"],long:1,...T.p2},
{part:3,pn:"Part 3",text:"Talk about the advantages and disadvantages of working from home. Give your own opinion.",table:{title:"Advantages and disadvantages of working from home.",pros:["It saves time on travelling to work.","The working schedule can be more flexible.","People feel comfortable in their own home."],cons:["It is hard to separate work and rest.","There is less communication with colleagues.","Family and noise can distract people."]},long:1,...T.p3}
];

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
let stream,ctx,src,proc,inRate,capturing=false,aborted=false,skipFn=null;
let unit=null,chunks=[],secs=0,qs=[],pending=[];

sb.auth.onAuthStateChange((_e,s)=>s?home():authView());
sb.auth.getSession().then(({data})=>data.session?home():authView());

function authView(msg=""){
  app.innerHTML=`<h1>CEFR Speaking · Full Mock</h1><p class="mu">Kirish yoki ro‘yxatdan o‘tish</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Parol (kamida 6 belgi)">
  <button id="in">Kirish</button><button id="up" class="sec">Ro‘yxatdan o‘tish</button><p class="mu" id="msg">${esc(msg)}</p>`;
  const say=m=>$("#msg").textContent=m;
  $("#in").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(error)say("Xato: "+error.message)};
  $("#up").onclick=async()=>{const {data,error}=await sb.auth.signUp({email:$("#em").value.trim(),password:$("#pw").value});
    if(error)say("Xato: "+error.message);else if(!data.session)say("Emailingizga tasdiqlash xati yuborildi.")};
}
async function home(){
  app.innerHTML=`<h1>CEFR Speaking · Full Mock</h1>
  <p class="mu">Bitta to‘liq test: Part 1.1, 1.2, 2 va 3 ketma-ket. Savollar ovozda o‘qiladi, vaqt avtomatik ketadi. Test boshlangach to‘xtatib bo‘lmaydi deb hisoblang, jim joyda o‘tiring.</p>
  <button id="go">▶ Testni boshlash</button><p class="mu" id="err"></p>
  <h2 style="font-size:18px;margin-top:22px">Oxirgi natijalar</h2><div id="hs" class="mu">Yuklanmoqda…</div>
  <button class="sec sm" id="out" style="margin-top:20px">Chiqish</button>`;
  $("#go").onclick=begin;$("#out").onclick=()=>sb.auth.signOut();
  const {data}=await sb.from("results").select("*").order("created_at",{ascending:false}).limit(10);
  if($("#hs"))$("#hs").innerHTML=data&&data.length?data.map(h=>`<div class="hi"><span>${esc(h.part)} · ${new Date(h.created_at).toLocaleDateString()}</span><b>${esc(h.level)} · ${h.score}/75</b></div>`).join(""):"Hozircha natija yo‘q.";
}
async function begin(){
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch{return $("#err").textContent="Mikrofonga ruxsat bering."}
  ctx=new (window.AudioContext||window.webkitAudioContext)();inRate=ctx.sampleRate;
  src=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(4096,1,1);
  proc.onaudioprocess=e=>{if(capturing)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
  src.connect(proc);proc.connect(ctx.destination);
  aborted=false;unit=null;pending=[];
  if(window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  run();
}
function speak(t){return new Promise(res=>{
  if(!window.speechSynthesis||aborted)return res();
  const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.95;let d=false;const f=()=>{if(!d){d=true;res()}};
  u.onend=f;u.onerror=f;setTimeout(f,25000);speechSynthesis.speak(u)})}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},200)}catch{}}
function stepper(p){return `<div class="st">`+[1,2,3].map(i=>`${i>1?`<div class="bar ${p>=i?"done":""}"></div>`:""}<div class="c ${p>i?"done":p===i?"on":""}">${p>i?"✓":i}</div>`).join("")+`</div>`}
function view(s){
  let h=`<div class="q">`;
  if(s.n)h+=`<b>Question ${s.n}.</b> ${esc(s.text)}`;else h+=`<b>${esc(s.text)}</b>`;
  if(s.pics)h+=`<div class="pics">${s.pics.map(p=>`<div class="pic">${p.img?`<img src="${p.img}">`:p.e}<small>${esc(p.c)}</small></div>`).join("")}</div>`;
  if(s.bullets)h+=`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`;
  if(s.table)h+=`<table><tr><th colspan="2" style="text-align:center">${esc(s.table.title)}</th></tr><tr><th>Pros</th><th>Cons</th></tr><tr><td><ul>${s.table.pros.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></td><td><ul>${s.table.cons.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></td></tr></table>`;
  h+=`</div>`;
  app.innerHTML=stepper(s.part)+`<div class="row">${h}<div class="tm" id="tm"></div></div>
  <div style="display:flex;gap:8px;margin-top:20px"><button class="sec sm" id="skip">Keyingisi ›</button><button class="sec sm" id="stop">✕ To‘xtatish</button></div>`;
  $("#skip").onclick=()=>skipFn&&skipFn();
  $("#stop").onclick=()=>{aborted=true;speechSynthesis&&speechSynthesis.cancel();skipFn&&skipFn();cleanup();home()};
}
function draw(left,total,rect,txt){
  const el=$("#tm");if(!el)return;
  if(rect){el.innerHTML=`<div class="rect">${txt||mmss(Math.max(left,0))}</div>`;return}
  const C=2*Math.PI*62;
  el.innerHTML=`<div class="ring"><svg width="140" height="140"><circle cx="70" cy="70" r="62" fill="none" stroke="#e3e6e8" stroke-width="12"/><circle cx="70" cy="70" r="62" fill="none" stroke="#111" stroke-width="12" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.max(left,0)/total)}"/></svg><b>${Math.max(left,0)}</b></div>`;
}
function count(total,rect){return new Promise(res=>{
  let left=total;draw(left,total,rect);
  const t=setInterval(()=>{left--;draw(left,total,rect);if(left<=0){clearInterval(t);skipFn=null;res(total)}},1000);
  skipFn=()=>{clearInterval(t);skipFn=null;res(total-left)};
})}
async function run(){
  for(const s of STEPS){
    if(aborted)return;
    if(unit!==s.pn){if(unit)finishUnit();unit=s.pn;chunks=[];secs=0;qs=[]}
    qs.push((s.n?"Q"+s.n+": ":"")+s.text+(s.bullets?" "+s.bullets.join(" "):"")+(s.desc?" ["+s.desc+"]":"")+(s.table?" [Table pros: "+s.table.pros.join("; ")+". Cons: "+s.table.cons.join("; ")+"]":""));
    view(s);draw(s.prep,s.prep,false);
    await speak(s.text+(s.bullets?" "+s.bullets.join(" "):""));
    if(aborted)return;
    await count(s.prep,false);
    if(aborted)return;
    beep();capturing=true;
    const used=await count(s.ans,!!s.long);
    capturing=false;secs+=used;
    if(s.long&&!aborted){draw(0,1,true,"Time up!");await new Promise(r=>setTimeout(r,900))}
  }
  if(aborted)return;
  finishUnit();cleanup();
  app.innerHTML=`<h1>Baholanmoqda…</h1><p class="mu">Gemini javoblaringizni tekshiryapti, bir daqiqa kuting.</p>`;
  result(await Promise.all(pending));
}
function cleanup(){capturing=false;try{proc.disconnect();src.disconnect();stream.getTracks().forEach(t=>t.stop());ctx.close()}catch{}}
function finishUnit(){
  const pn=unit,question=qs.join(" | "),seconds=secs,ch=chunks;
  pending.push((async()=>{
    if(seconds<3)return {pn,score:0,level:"Below B1",fluency:0,vocabulary:0,grammar:0,pronunciation:0,summary:"Bu qismda deyarli gapirilmadi.",tips:[]};
    try{
      const b64=await toWavB64(ch);
      const {data}=await sb.auth.getSession();
      const r=await fetch("/api/grade",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+data.session.access_token},body:JSON.stringify({audio:b64,part:pn,question,seconds})});
      const j=await r.json();if(!r.ok)throw new Error(j.error||"Xato");
      return {pn,...j};
    }catch(e){return {pn,error:e.message}}
  })());
}
function toWavB64(ch){
  const R=11025,n=ch.reduce((a,c)=>a+c.length,0),all=new Float32Array(n);let o=0;
  ch.forEach(c=>{all.set(c,o);o+=c.length});
  const ratio=inRate/R,len=Math.floor(n/ratio),pcm=new Int16Array(len);
  for(let i=0;i<len;i++){const s=Math.floor(i*ratio),e=Math.min(Math.floor((i+1)*ratio),n);let sum=0;
    for(let j=s;j<e;j++)sum+=all[j];pcm[i]=Math.max(-1,Math.min(1,sum/Math.max(e-s,1)))*32767}
  const h=new DataView(new ArrayBuffer(44)),w=(p,s)=>[...s].forEach((c,i)=>h.setUint8(p+i,c.charCodeAt(0)));
  w(0,"RIFF");h.setUint32(4,36+len*2,true);w(8,"WAVEfmt ");h.setUint32(16,16,true);h.setUint16(20,1,true);h.setUint16(22,1,true);
  h.setUint32(24,R,true);h.setUint32(28,R*2,true);h.setUint16(32,2,true);h.setUint16(34,16,true);w(36,"data");h.setUint32(40,len*2,true);
  return new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result.split(",")[1]);f.readAsDataURL(new Blob([h,pcm],{type:"audio/wav"}))});
}
const lvl=s=>s>=65?"C1":s>=51?"B2":s>=38?"B1":"Below B1";
function result(rs){
  const ok=rs.filter(r=>!r.error),avg=k=>ok.length?(ok.reduce((a,r)=>a+(+r[k]||0),0)/ok.length).toFixed(1):"0";
  const score=ok.length?Math.round(ok.reduce((a,r)=>a+(+r.score||0),0)/ok.length):0,level=lvl(score);
  app.innerHTML=stepper(4)+`<div class="mu" style="text-align:center">Umumiy daraja</div><div class="big">${level}</div><div class="mu" style="text-align:center">${score} / 75</div>
  <div class="g"><div>Ravonlik<br><b>${avg("fluency")}/10</b></div><div>Lug‘at<br><b>${avg("vocabulary")}/10</b></div><div>Grammatika<br><b>${avg("grammar")}/10</b></div><div>Talaffuz<br><b>${avg("pronunciation")}/10</b></div></div>
  ${rs.map(r=>r.error?`<p><b>${esc(r.pn)}:</b> baholanmadi (${esc(r.error)})</p>`:`<div class="hi" style="display:block"><b>${esc(r.pn)} · ${esc(r.level)} · ${esc(r.score)}/75</b><br>${esc(r.summary)}${(r.tips||[]).map(t=>`<br>• ${esc(t)}`).join("")}</div>`).join("")}
  <p class="mu">Daraja taxminiy: 65+ C1, 51+ B2, 38+ B1.</p><button id="back">Bosh sahifa</button>`;
  $("#back").onclick=home;
  if(ok.length)sb.from("results").insert({part:"Full mock",level,score});
}
</script></body></html>
